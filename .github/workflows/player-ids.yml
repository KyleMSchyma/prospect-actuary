# Rebuilds the canonical player list (data/players.json), data manifest (data/manifest.json), Sleeper id crosswalk (data/sleeper_ids.json)
# NFL production / career comparables for player profiles (data/production.json) and NFL team analytics (data/teams/)
# whenever a grade or value file changes, every Wednesday (new nflverse rosters), or by hand.
# scripts/build_players.py validates first: if a check fails the job fails, nothing is written,
# and the site keeps the last good files. If nothing changed, nothing is committed.
name: Player ids

on:
  push:
    branches: [main]
    paths:
      - "pre-draft/data/pd_player_grades.csv"
      - "post-draft/data/pd_post_player_grades.csv"
      - "post-draft/data/pd_post_2027_mock_grades.csv"
      - "trade-values/data/tv.js"
      - "scripts/build_players.py"
      - "scripts/build_sleeper_ids.py"
      - "scripts/build_production.py"
      - "scripts/build_teams.py"
  schedule:
    - cron: "0 15 * * 3"   # Wednesdays, the day after the Tuesday refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: player-ids
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the manifest records when each data file last changed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate player ids
        run: python3 scripts/build_players.py
      - name: Build Sleeper id crosswalk
        # Sleeper league import (shared/sleeper.js). If the DynastyProcess id file can't be read, keep the last good file.
        continue-on-error: true
        run: python3 scripts/build_sleeper_ids.py
      - name: Build NFL production, usage and career comparables
        # Player profiles (data/production.json) from nflverse season stats and snap counts. If nflverse can't be read
        # or a check fails, keep the last good file.
        continue-on-error: true
        run: python3 scripts/build_production.py
      - name: Build NFL team analytics
        # /team-analytics/ and player profiles (data/teams/) from nflverse weekly player stats. Keeps the last good files on failure.
        continue-on-error: true
        run: python3 scripts/build_teams.py
      - name: Commit if changed
        run: |
          git add data/players.json data/manifest.json data/sleeper_ids.json data/production.json data/teams
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild player ids and data manifest"
          git pull --rebase origin main
          git push origin HEAD:main
